name: Package Boot Folder

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 获取时间并生成 v.json (使用 cat <<EOF 避免 YAML 引号冲突)
      - name: Generate v.json with UTC+8 time
        run: |
          CURRENT_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          echo "Current compile time (UTC+8): $CURRENT_TIME"
          
          # 使用 heredoc (EOF) 写入 JSON，完美避开 YAML 多行字符串的引号解析陷阱
          cat <<EOF > v.json
          {
            "version": "$CURRENT_TIME"
          }
          EOF
          
          echo "Generated v.json:"
          cat v.json

      # 3. 移动文件并打包 (去除 boot 外层目录)
      - name: Create ZIP archive (Flattened)
        run: |
          if [ ! -d "boot" ]; then
            echo "Error: boot directory not found!"
            exit 1
          fi
          
          # 将 v.json 移入 boot
          mv v.json boot/
          
          # 进入 boot 目录，将内部所有文件直接打包到上一级
          cd boot
          zip -r ../boot-package.zip .
          cd ..
          
          echo "Archive created successfully. Contents preview:"
          unzip -l boot-package.zip

      # 4. 上传到 Artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-package-${{ github.run_number }}
          path: boot-package.zip
          retention-days: 7
