name: Build and Release Boot

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # ⚠️ 必须授予 contents: write 权限，否则无法创建 Release
    permissions:
      contents: write 

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 生成纯数字时间戳、v.json 并输出变量供后续步骤使用
      - name: Generate Timestamp and v.json
        id: build_info
        run: |
          # 获取纯数字 Unix 时间戳 (秒)
          TIMESTAMP=$(date +%s)
          # 将时间戳写入 GITHUB_OUTPUT，供后面的 Release 步骤作为 Tag 使用
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          echo "Current timestamp: $TIMESTAMP"
          
          # 生成 v.json
          cat <<EOF > v.json
          {
            "version": "$TIMESTAMP"
          }
          EOF
          
          cat v.json

      # 3. 打包 boot 文件夹 (去除外层 boot 目录)
      - name: Package Boot Folder
        run: |
          if [ ! -d "boot" ]; then
            echo "Error: boot directory not found!"
            exit 1
          fi
          
          mv v.json boot/
          cd boot
          zip -r ../boot-package.zip .
          cd ..
          
          echo "Package created. Contents preview:"
          unzip -l boot-package.zip

      # 4. 自动创建 GitHub Release 并上传压缩包
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用刚才生成的时间戳作为版本号和 Tag (例如: v1755504600)
          tag_name: v${{ steps.build_info.outputs.timestamp }}
          name: Release v${{ steps.build_info.outputs.timestamp }}
          files: boot-package.zip
          generate_release_notes: true # 自动根据近期的 commit 生成更新日志
